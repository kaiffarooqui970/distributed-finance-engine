services:
  # Database Server - MySQL
  db:
    image: mysql:8.0
    container_name: financial_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: finance_db
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql

  # Backend Server I - Python (Authentication)
  auth_service:
    build: ./auth_service
    container_name: auth_backend
    depends_on:
      - db
    volumes:
      - ./auth_service:/app

  # Backend Server II - C++ (Finance Engine)
  finance_service:
    build: ./finance_service
    container_name: finance_backend
    depends_on:
      - db

  # Gateway Server - Python/Django
  gateway:
    build: ./gateway
    container_name: gateway_server
    ports:
      - "8000:8000"
    depends_on:
      - auth_service
      - finance_service
    volumes:
      - ./gateway:/app

  
  # Frontend Server
  frontend:
    build: ./frontend
    container_name: frontend_web
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app